[package]
authors = [
  "Andrew Wheeler <genusistimelord@outlook.com>",
  "Sherwin Salonga",
  "S.J.R. van Schaik",
]
edition = "2024"
license = "MIT OR Apache-2.0"
name = "mapeditor"
resolver = "2"
version = "0.3.0"

[dependencies]
ahash = "0.8.11"
arboard = "3.4.1"
ascending_camera = "0.9.0"
ascending_graphics = {version = "0.46.0", features = ["static_dx", "rayon"]}
ascending_input = "0.6.2"
ascending_time = {version = "0.5.0", features = ["enable_serde", "enable_mmap_bytey", "enable_bytey"]}
backtrace = "0.3.76"
bit_op = "0.1.1"
bytemuck = {version = "1.25.2", features = ["derive"]}
bytey = "0.4.0"
chrono = {version = "0.4.45", disable-defaults = true, features = [
  "clock",
  "serde",
  "std",
]}
futures = "0.3.34"
glam = {version = "0.33.3", features = ["bytemuck", "mint"]}
guillotiere = "0.7.0"
image = "0.25.10"
indexmap = "2.14.0"
log = "0.4.33"
mint = "0.5.9"
rodio = "0.22.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
slab = "0.4.12"
slotmap = "1.1.1"
snafu = {version = "0.9.2", features = [
  "backtraces-impl-backtrace-crate",
  "rust_1_81",
]}
speedy = "0.8.7"
thiserror = "2.0.20"
tokio = {version = "1.53.1", features = ["full"]}
winit = {version = "0.30.13", features = ["serde", "rwh_05"]}
